# Cedar Chat Cloud Gateway Worker
# 部署命令: cd worker && wrangler deploy

name = "cedar-cloud-gateway"
main = "gateway.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── R2 Bucket 绑定 ────────────────────────────────────────────
# 绑定名称必须是 CEDAR_SYNC_BUCKET（gateway.js 中引用的名称）
# bucket_name 改成你实际的 R2 bucket 名称
[[r2_buckets]]
binding = "CEDAR_SYNC_BUCKET"
bucket_name = "cedar-sync"

# ─── 环境变量 ─────────────────────────────────────────────────
[vars]
# 允许的前端域名（逗号分隔），用于 CORS
# 部署后改成你的实际前端域名
ALLOWED_ORIGINS = "https://your-frontend.pages.dev,http://localhost:5173"

# ─── 自定义域名（可选）────────────────────────────────────────
# 如果需要自定义域名，取消注释并修改
# [routes]
# { pattern = "gateway.your-domain.com/*", zone_name = "your-domain.com" }

# ─── 生产环境覆盖（可选）──────────────────────────────────────
# [env.production]
# vars = { ALLOWED_ORIGINS = "https://your-production-domain.com" }
